name: country_phone_kit
description: >-
  Country list, flags, ISO and dial codes, currencies, per-country phone
  validation and as-you-type formatting — as plain Dart data, plus optional
  themed phone field, country picker and currency picker.
version: 1.0.0
homepage: https://github.com/sawongam/country_phone_kit
repository: https://github.com/sawongam/country_phone_kit
issue_tracker: https://github.com/sawongam/country_phone_kit/issues
documentation: https://github.com/sawongam/country_phone_kit#readme

topics:
  - country
  - phone
  - validation
  - currency
  - flags

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Google's libphonenumber metadata, ported to Dart. Used for real validation
  # (not a length check) and for digit-grouping as the user types.
  dlibphonenumber: ^1.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Demo video shown on the package page.
screenshots:
  - description: Phone field, country picker and currency picker in action.
    path: docs/country.gif
