name: country_phone_kit
description: >-
  Country and phone utilities for Flutter, with ISO codes, flags, validation, formatting, and ready-to-use UI
version: 1.0.0
homepage: https://github.com/sawongam/country-phone-kit
repository: https://github.com/sawongam/country-phone-kit
issue_tracker: https://github.com/sawongam/country-phone-kit/issues
documentation: https://github.com/sawongam/country-phone-kit#readme

topics:
  - country
  - phone
  - validation
  - currency
  - flags

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Google's libphonenumber metadata, ported to Dart. Used for real validation
  # (not a length check) and for digit-grouping as the user types.
  dlibphonenumber: ^1.1.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Demo video shown on the package page.
screenshots:
  - description: Phone field, country picker and currency picker in action.
    path: docs/country.gif
